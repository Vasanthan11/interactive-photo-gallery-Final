<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="css/gallery.css">
    <script src="js/gallery.js"></script>
</head>

<body onload="addTabIndex()">

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery" aria-label="Interactive photo gallery">

        <img class="preview"
             alt="Styling with a Bandana"
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             alt="With My Boy"
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.JPG"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             alt="Young Puppy"
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             alt="Happy Puppy Outdoors"
             src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=80"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             alt="Golden Puppy Sitting"
             src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=800&q=80"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             alt="Puppy Playing in the Grass"
             src="https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?auto=format&fit=crop&w=800&q=80"
             onmouseover="upDate(this)"
             onmouseleave="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

    </div>

</body>
</html>
